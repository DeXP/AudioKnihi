name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

# Prevent concurrent runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt-in to Node.js 24 for JavaScript actions (fixes deprecation warning)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # === Job: Build & Deploy Vue app + Generate Catalog ===
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # Required for GitHub Pages deployment
      id-token: write   # Required for OIDC token
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      # === 🔥 Generate catalog.json fresh on every build ===
      - name: Generate catalog.json
        run: node scripts/generate.cjs
        # ✅ catalog.json is created in repo root, then copied to dist/
      
      - name: Build Vite app
        run: npm run build
        env:
          # For custom domain audioknihi.dexp.in (root), use '/'
          VITE_BASE: '/'
      
      # === Copy static data to dist for deployment ===
      - name: Copy catalog.json and book folder to dist
        run: |
          echo "📦 Copying static assets to dist/"
          cp catalog.json dist/
          cp -r book dist/
          echo "✅ dist/ contents:"
          ls -la dist/
          # Optional: show book count
          echo "📚 Books in deployment: $(ls dist/book/*.json 2>/dev/null | wc -l)"
      
      # === GitHub Pages deployment steps ===
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5