name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 🔑 Opt-in to Node.js 24 for JavaScript actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - uses: actions/checkout@v6  # ✅ Updated to v6 (recommended by FTP action)
      
      - name: Setup Node
        uses: actions/setup-node@v4  # ✅ Keep v4 (v5 not yet widely available)
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate catalog.json
        run: node scripts/generate.cjs
      
      # === 📤 FTP Upload: catalog.json → audioknihi_catalog.cache.json ===
      - name: Prepare FTP upload directory
        run: |
          mkdir -p ftp-upload
          cp catalog.json ftp-upload/audioknihi_catalog.cache.json
          echo "✅ Files in ftp-upload/:"
          ls -la ftp-upload/

      # 🔍 DEBUG: Verify file exists before FTP step (optional but helpful)
      - name: Verify FTP file exists
        run: |
          if [ -f "ftp-upload/audioknihi_catalog.cache.json" ]; then
            echo "✅ File ready for upload"
            ls -lh ftp-upload/audioknihi_catalog.cache.json
          else
            echo "❌ File not found!"
            exit 1
          fi

      - name: Upload catalog cache via FTP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          # ✅ CRITICAL FIX: Use absolute path via github.workspace
          local-dir: ${{ github.workspace }}/ftp-upload
          server-dir: ${{ secrets.FTP_PATH }}
          exclude: ''
          log-level: verbose
          dangerous-clean-slate: false
      
      # === Continue with Vite build ===
      - name: Build Vite app
        run: npm run build
        env:
          VITE_BASE: '/'
      
      - name: Copy catalog.json and book folder to dist
        run: |
          echo "📦 Copying static assets to dist/"
          cp catalog.json dist/
          cp -r book dist/
          echo "✅ dist/ contents:"
          ls -la dist/
          echo "📚 Books: $(ls dist/book/*.json 2>/dev/null | wc -l)"
      
      # === GitHub Pages deployment ===
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      
      # === Cleanup ===
      - name: Cleanup FTP temp files
        if: always()
        run: rm -rf ftp-upload/