name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate catalog.json
        run: node scripts/generate.cjs
      
      # === 📤 FTP Upload: catalog.json → audioknihi_catalog.cache.json ===
      - name: Prepare catalog for FTP upload
        run: cp catalog.json audioknihi_catalog.cache.json
      
      - name: Upload catalog cache via FTP
        # ✅ Only run on push to main (secrets check removed - handled by action)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true  # ✅ Skip silently if secrets missing (PRs, forks)
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_PATH }}
          file-list: |
            audioknihi_catalog.cache.json
          exclude: |
            **/*
            !audioknihi_catalog.cache.json
          log-level: verbose
      
      # === Continue with Vite build ===
      - name: Build Vite app
        run: npm run build
        env:
          VITE_BASE: '/'
      
      - name: Copy catalog.json and book folder to dist
        run: |
          echo "📦 Copying static assets to dist/"
          cp catalog.json dist/
          cp -r book dist/
          echo "✅ dist/ contents:"
          ls -la dist/
          echo "📚 Books: $(ls dist/book/*.json 2>/dev/null | wc -l)"
      
      # === GitHub Pages deployment ===
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5