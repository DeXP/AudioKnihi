name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 🔑 Opt-in to Node.js 24 for JavaScript actions (suppresses deprecation errors)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'  # Your app runtime — still valid
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate catalog.json
        run: node scripts/generate.cjs
      
      # === 📤 FTP Upload: catalog.json → audioknihi_catalog.cache.json ===
      - name: Prepare FTP upload directory
        # Create isolated folder with ONLY the file to upload
        run: |
          mkdir -p ftp-upload
          cp catalog.json ftp-upload/audioknihi_catalog.cache.json
          echo "✅ Prepared $(ls ftp-upload/ | wc -l) file(s) for FTP upload"
      
      - name: Upload catalog cache via FTP
        # Only run on push to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true  # Graceful skip if secrets missing
        uses: SamKirkland/FTP-Deploy-Action@v4.3.7  # ✅ Updated to latest
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT || 21 }}  # Optional: default to 21
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}  # 'ftp' or 'ftps'
          # ✅ Upload from isolated directory (only catalog file inside)
          local-dir: ./ftp-upload/
          server-dir: ${{ secrets.FTP_PATH }}
          # No file-list needed — directory contains only our target file
          exclude: ''  # Nothing to exclude
          log-level: verbose
          # Optional: prevent accidental deletions on server
          dangerous-clean-slate: false
      
      # === Continue with Vite build ===
      - name: Build Vite app
        run: npm run build
        env:
          VITE_BASE: '/'
      
      - name: Copy catalog.json and book folder to dist
        run: |
          echo "📦 Copying static assets to dist/"
          cp catalog.json dist/
          cp -r book dist/
          echo "✅ dist/ contents:"
          ls -la dist/
          echo "📚 Books: $(ls dist/book/*.json 2>/dev/null | wc -l)"
      
      # === GitHub Pages deployment ===
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      
      # === Cleanup: remove temp FTP directory ===
      - name: Cleanup FTP temp files
        if: always()  # Run even if previous steps fail
        run: rm -rf ftp-upload/