name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      # === 🔥 Generate catalog.json ===
      - name: Generate catalog.json
        run: node scripts/generate.cjs
      
      # === 📤 FTP Upload Prep ===
      - name: Prepare FTP upload directory
        run: |
          mkdir -p ftp-upload
          cp catalog.json ftp-upload/audioknihi_catalog.cache.json
          echo "✅ Prepared: $(ls ftp-upload/)"
      
      - name: Upload catalog cache via FTP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          # ✅ CRITICAL: Must end with / per action documentation
          local-dir: ${{ github.workspace }}/ftp-upload/
          server-dir: ${{ secrets.FTP_PATH }}
          exclude: ''
          log-level: verbose
          dangerous-clean-slate: false
      
      # === 🏗️ Vite Build ===
      - name: Build Vite app
        run: npm run build
        env:
          VITE_BASE: '/'
      
      # === 📦 Prepare GitHub Pages Artifact ===
      - name: Copy catalog.json and book folder to dist
        run: |
          cp catalog.json dist/
          cp -r book dist/
          echo "✅ dist/ ready for deployment"
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist  # ✅ No trailing slash needed here
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      
      # === 🧹 Cleanup ===
      - name: Cleanup FTP temp files
        if: always()
        run: rm -rf ftp-upload/